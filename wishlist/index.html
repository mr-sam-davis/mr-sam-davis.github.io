<style>
  :root {
    --bg: #F4EFE7;
    --bar: rgba(244, 239, 231, .82);
    --card: #FFFDF9;
    --ink: #221D17;
    --muted: #776D61;
    --line: #E4DBCD;
    --tile: #FFFFFF;
    --accent: #2E5A44;
    --accent-ink: #FFFFFF;
    --accent-soft: #E4EEE7;
    --scrim: rgba(30, 22, 14, .38);
    --shadow: 0 1px 2px rgba(60, 40, 20, .05), 0 6px 20px rgba(60, 40, 20, .06);
    --serif: "Fraunces", Georgia, "Times New Roman", serif;
    --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --gl: max(16px, env(safe-area-inset-left));
    --gr: max(16px, env(safe-area-inset-right));
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #14120F; --bar: rgba(20, 18, 15, .8); --card: #1D1A16; --ink: #F2ECE3; --muted: #A89E91;
      --line: #322C25; --accent: #9ACBAE; --accent-ink: #10231A; --accent-soft: #1E3027;
      --scrim: rgba(0, 0, 0, .55); --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #14120F; --bar: rgba(20, 18, 15, .8); --card: #1D1A16; --ink: #F2ECE3; --muted: #A89E91;
    --line: #322C25; --accent: #9ACBAE; --accent-ink: #10231A; --accent-soft: #1E3027;
    --scrim: rgba(0, 0, 0, .55); --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.45 var(--sans); -webkit-font-smoothing: antialiased; overflow-x: hidden;
  }
  body.locked { overflow: hidden; }
  button { font: inherit; color: inherit; }
  img { display: block; max-width: 100%; }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 0 var(--gr) 0 var(--gl); }

  /* ---------- Title ---------- */
  .title {
    padding: calc(28px + env(safe-area-inset-top)) 0 4px;
    display: flex; align-items: flex-end; justify-content: space-between; gap: 12px;
  }
  .title .sort { margin-bottom: 4px; }
  h1 {
    font-family: var(--serif); font-weight: 520; font-variation-settings: "SOFT" 100, "opsz" 144;
    font-size: clamp(38px, 10.5vw, 64px); line-height: 1; letter-spacing: -.02em; margin: 0;
  }

  /* ---------- Sort button ---------- */
  .pill {
    flex: 0 0 auto; border: 1px solid var(--line); background: var(--card); border-radius: 99px;
    padding: 7px 13px; font-size: 14px; font-weight: 600; cursor: pointer; min-height: 36px;
    display: inline-flex; align-items: center; gap: 6px; -webkit-tap-highlight-color: transparent;
  }
  .sort { flex: 0 0 auto; }
  .sort svg { width: 15px; height: 15px; transition: transform .2s ease; }
  .sort[data-dir="asc"] svg { transform: rotate(180deg); }

  /* ---------- Grid ---------- */
  .grid {
    display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px 12px;
    padding: 14px 0 calc(32px + env(safe-area-inset-bottom)); margin: 0; list-style: none;
  }
  @media (min-width: 640px) { .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px 16px; } }
  @media (min-width: 980px) { .grid { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 28px 20px; } }
  @media (min-width: 1240px) { .grid { grid-template-columns: repeat(5, minmax(0, 1fr)); } }

  .tile {
    display: block; width: 100%; text-align: left; background: none; border: 0; padding: 0;
    cursor: pointer; -webkit-tap-highlight-color: transparent;
  }
  .tile .ph {
    aspect-ratio: 1; border-radius: 20px; background: var(--tile); overflow: hidden;
    box-shadow: var(--shadow); transition: transform .18s ease; position: relative;
  }
  .tile:active .ph { transform: scale(.97); }
  @media (hover: hover) { .tile:hover .ph { transform: translateY(-2px); } }
  .tile .ph img { width: 100%; height: 100%; object-fit: contain; padding: 12%; }
  .tile .name {
    font-size: 14.5px; font-weight: 600; line-height: 1.25; margin: 10px 2px 2px;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .tile .spec {
    font-size: 12.5px; line-height: 1.3; color: var(--muted); margin: 0 2px 5px;
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
  }
  .tile .meta { margin: 0 2px; display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; }
  .tile .price { font-family: var(--serif); font-weight: 560; font-size: 18px; font-variant-numeric: lining-nums; }
  /* Struck-through original price, and the grey note after a name. */
  .was { font-family: var(--sans); font-weight: 450; font-size: .72em; color: var(--muted); text-decoration: line-through; text-decoration-thickness: 1px; }
  .nn { font-weight: 450; color: var(--muted); }
  .tile .price .was { margin-left: 5px; }

  .placeholder { width: 100%; height: 100%; display: grid; place-items: center; color: #C9BFB2; }
  .placeholder svg { width: 38%; height: 38%; }

  /* ---------- Detail sheet ---------- */
  dialog {
    padding: 0; border: 0; color: var(--ink); background: var(--card);
    width: 100%; max-width: 100%; max-height: 92svh; margin: auto 0 0;
    border-radius: 24px 24px 0 0; overflow: hidden; display: flex; flex-direction: column;
    box-shadow: 0 -10px 40px rgba(0,0,0,.18);
  }
  dialog:not([open]) { display: none; }
  dialog::backdrop { background: var(--scrim); }
  dialog[open] { animation: up .32s cubic-bezier(.2, .8, .2, 1); }
  dialog[open]::backdrop { animation: fade .3s ease; }
  dialog.closing { animation: down .22s ease-in forwards; }
  dialog.closing::backdrop { animation: fade .22s ease reverse forwards; }
  @keyframes up { from { transform: translateY(100%); } }
  @keyframes down { to { transform: translateY(100%); } }
  @keyframes fade { from { opacity: 0; } }
  @media (min-width: 640px) {
    dialog { max-width: 520px; margin: auto; border-radius: 26px; max-height: 86vh; }
    @keyframes up { from { transform: translateY(24px) scale(.98); opacity: 0; } }
    @keyframes down { to { transform: translateY(16px) scale(.98); opacity: 0; } }
  }

  .grab { flex: 0 0 auto; padding: 8px 0 2px; display: grid; place-items: center; cursor: grab; touch-action: none; }
  .grab span { width: 38px; height: 5px; border-radius: 3px; background: var(--line); }
  @media (min-width: 640px) { .grab { display: none; } }
  .close {
    position: absolute; top: 12px; right: 12px; width: 32px; height: 32px; border-radius: 50%;
    border: 0; background: var(--bg); display: grid; place-items: center; cursor: pointer; z-index: 2;
  }
  .close svg { width: 14px; height: 14px; }
  .scroll { overflow-y: auto; overscroll-behavior: contain; padding: 6px 18px calc(22px + env(safe-area-inset-bottom)); }
  @media (min-width: 640px) { .scroll { padding: 22px 24px 24px; } }

  .head { display: grid; grid-template-columns: 112px 1fr; gap: 14px; align-items: center; padding-right: 34px; margin-bottom: 18px; }
  .head .ph { aspect-ratio: 1; border-radius: 16px; background: var(--tile); overflow: hidden; border: 1px solid var(--line); }
  .head .ph img { width: 100%; height: 100%; object-fit: contain; padding: 10%; }
  .head h2 {
    font-family: var(--serif); font-weight: 540; font-variation-settings: "SOFT" 100, "opsz" 48;
    font-size: 22px; line-height: 1.12; margin: 0 0 6px; letter-spacing: -.005em; text-wrap: balance;
  }
  .head .spec { font-size: 13.5px; color: var(--muted); margin: 0 0 8px; line-height: 1.35; }
  .head .price { font-family: var(--serif); font-weight: 580; font-size: 24px; line-height: 1; }
  .head .pnote { display: block; font-family: var(--sans); font-weight: 400; font-size: 12.5px; color: var(--muted); margin-top: 4px; }

  .sec { font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 650; margin: 0 0 8px 2px; }
  .list { border: 1px solid var(--line); border-radius: 16px; overflow: hidden; margin: 0 0 20px; background: var(--card); }
  .row {
    display: flex; align-items: center; gap: 12px; padding: 11px 12px 11px 14px; min-height: 56px;
    text-decoration: none; color: inherit; -webkit-tap-highlight-color: transparent;
  }
  .row + .row { border-top: 1px solid var(--line); }
  .row:active { background: var(--bg); }
  @media (hover: hover) { .row:hover { background: var(--bg); } }
  .row.best { background: var(--accent-soft); }
  .row .mark { width: 8px; height: 8px; border-radius: 50%; flex: 0 0 auto; background: transparent; }
  .row.best .mark { background: var(--accent); }
  .row .main { flex: 1; min-width: 0; }
  .row .store { display: block; font-weight: 620; font-size: 15.5px; line-height: 1.25; }
  .row .detail { display: block; font-size: 13px; color: var(--muted); line-height: 1.3; }
  .row.best .detail { color: var(--accent); }
  .row .amt { font-weight: 650; font-variant-numeric: tabular-nums; white-space: nowrap; font-size: 15.5px; }
  .row .amt.check { font-weight: 500; font-size: 13.5px; color: var(--muted); }
  .row svg { width: 16px; height: 16px; flex: 0 0 auto; opacity: .45; }

  .list { margin-bottom: 0; }
  .row .amt .was { margin-right: 6px; font-size: 13px; }
  .head .price .was { margin-left: 6px; }
  .head h2 .nn { font-family: var(--sans); font-size: 14px; font-weight: 500; white-space: nowrap; }

  /* ---------- Locked ---------- */
  .gate { min-height: 100svh; display: grid; place-items: center; padding: 24px; text-align: center; }
  .gate div { max-width: 340px; }
  .gate h1 { font-size: 40px; margin-bottom: 12px; }
  .gate p { color: var(--muted); margin: 0; }
  [hidden] { display: none !important; }

  @media (prefers-reduced-motion: reduce) { *, *::backdrop { transition: none !important; animation: none !important; } }
</style>
</head>

<div class="gate" id="gate"><div><p>Opening…</p></div></div>

<div id="app" hidden>
  <div class="wrap">

      <h1 id="title">Wishlist</h1>
      <button type="button" class="pill sort" id="sort" data-dir="asc" aria-label="Sort by price">
        Price

      </button>
    </div>

    <ul class="grid" id="grid"></ul>
  </div>
</div>

<dialog id="sheet" aria-labelledby="sheet-title">

</dialog>

    if (w && wasFirst) p.appendChild(w);
    p.appendChild(document.createTextNode(price));
    if (w && !wasFirst) p.appendChild(w);
    return p;
  }

  // Item name with an optional grey note after it.
  function nameEl(tag, cls, item) {
    var n = el(tag, cls, item.name);
    if (item.nameNote) { n.appendChild(document.createTextNode(" ")); n.appendChild(el("span", "nn", item.nameNote)); }
    return n;
  }

  function fillSheet(item) {
    var head = el("div", "head");
    head.appendChild(photo(item, "ph"));
    var info = el("div");
    var h = nameEl("h2", null, item); h.id = "sheet-title";
    info.appendChild(h);
    info.appendChild(el("p", "spec", item.spec));
    var price = priceEl("price", item.price, item.was);
    price.style.display = "block";
    if (item.priceNote) price.appendChild(el("span", "pnote", item.priceNote));
    info.appendChild(price);
    head.appendChild(info);

    var buyLabel = el("p", "sec", "Where to buy");
    var list = el("div", "list");
    item.shops.forEach(function (s, i) {
      var a = el("a", "row" + (s.best ? " best" : ""));
      a.href = s.url; a.target = "_blank"; a.rel = "noopener noreferrer";
      a.appendChild(el("span", "mark"));
      var m = el("span", "main");
      m.appendChild(el("span", "store", s.store));
      m.appendChild(el("span", "detail", s.detail));
      a.appendChild(m);
      var check = /^check$/i.test(s.price);
      a.appendChild(check ? el("span", "amt check", "See price") : priceEl("amt", s.price, s.was, true));
      a.insertAdjacentHTML("beforeend", chevron);
      list.appendChild(a);
    });

    body.replaceChildren(head, buyLabel, list);
    body.scrollTop = 0;
  }

  var closing = false;
  function openSheet(item) {
    fillSheet(item);
    sheet.style.transform = "";
    sheet.showModal();
    document.body.classList.add("locked");
    // Let the phone's back gesture close the sheet. Same URL, so the key stays.
    history.pushState({ sheet: item.id }, "", location.href);
  }
  function finishClose() {
    sheet.classList.remove("closing");
    sheet.style.transform = "";
    if (sheet.open) sheet.close();
    document.body.classList.remove("locked");
    closing = false;
  }
  function animateClose() {
    if (!sheet.open || closing) return;
    closing = true;
    var reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (reduce) return finishClose();
    sheet.classList.add("closing");
    setTimeout(finishClose, 220);
  }
  // All closes go through history so the back stack stays tidy.
  function requestClose() { if (history.state && history.state.sheet) history.back(); else animateClose(); }
  window.addEventListener("popstate", animateClose);
  $("close").addEventListener("click", requestClose);
  sheet.addEventListener("cancel", function (e) { e.preventDefault(); requestClose(); });
  sheet.addEventListener("click", function (e) { if (e.target === sheet) requestClose(); }); // tap on backdrop

  // Drag the sheet down to dismiss (phones).
  (function () {
    var startY = null, dy = 0;
    function start(e) {
      if (window.innerWidth >= 640) return;
      if (e.currentTarget === body && body.scrollTop > 0) return;
      startY = e.touches[0].clientY; dy = 0; sheet.style.transition = "none";
    }
    function move(e) {
      if (startY == null) return;
      dy = Math.max(0, e.touches[0].clientY - startY);
      if (dy > 0) { sheet.style.transform = "translateY(" + dy + "px)"; if (e.cancelable && e.currentTarget === body) e.preventDefault(); }
    }
    function end() {
      if (startY == null) return;
      startY = null; sheet.style.transition = "transform .2s ease";
      if (dy > 110) { requestClose(); } else { sheet.style.transform = ""; }
      setTimeout(function () { sheet.style.transition = ""; }, 220);
    }
    [$("grab"), body].forEach(function (t) {
      t.addEventListener("touchstart", start, { passive: true });
      t.addEventListener("touchmove", move, { passive: false });
      t.addEventListener("touchend", end);
      t.addEventListener("touchcancel", end);
    });
  })();

  /* ---------- Grid, filter, sort ---------- */
  var state = { dir: "asc" };
  try { state.dir = localStorage.getItem("wl-dir") === "desc" ? "desc" : "asc"; } catch (e) {}

  function tile(item) {
    var li = el("li");
    var b = el("button", "tile"); b.type = "button";
    b.setAttribute("aria-label", item.name + (item.nameNote ? " " + item.nameNote : "") + ", " + item.price + (item.was ? ", was " + item.was : ""));
    b.appendChild(photo(item, "ph"));
    b.appendChild(nameEl("div", "name", item));
    if (item.spec) b.appendChild(el("div", "spec", item.spec));
    var meta = el("div", "meta");
    meta.appendChild(priceEl("price", item.price, item.was));
    b.appendChild(meta);
    b.addEventListener("click", function () { openSheet(item); });
    li.appendChild(b);
    return li;
  }

  function render(data) {
    var items = data.items.slice()
      .sort(function (a, b) { return state.dir === "desc" ? b.sort - a.sort : a.sort - b.sort; });
    var grid = $("grid");
    grid.replaceChildren.apply(grid, items.map(tile));
    var s = $("sort");
    s.dataset.dir = state.dir;
    s.setAttribute("aria-label", state.dir === "asc" ? "Price, lowest first" : "Price, highest first");
  }

  function setupSort(data) {
    $("sort").addEventListener("click", function () {
      state.dir = state.dir === "asc" ? "desc" : "asc";
      try { localStorage.setItem("wl-dir", state.dir); } catch (e) {}
      render(data);
    });
  }

  decrypt().then(function (data) {
    var title = (data.owner || "Sam") + "’s wishlist";
    document.title = title;
    $("title").textContent = title;
    setupSort(data);
    render(data);
    $("gate").hidden = true;
    $("app").hidden = false;
  }).catch(locked);
})();
</script>
</body>
</html>
