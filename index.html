<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="utf-8">
  <title>Sam Davis</title>
  <meta name="description" content="Sam Davis makes apps: Points, a Virgin Atlantic reward seats finder, and more as iOS Team Lead at 3 Sided Cube.">
  <meta name="author" content="Sam Davis">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">

<body>

  <div class="layout">

          alt="Sam Davis"
          class="profile-photo"
          width="340"
          height="340"

    </div>

    <main class="panel panel--content">
      <div class="content-inner">
        <h1 class="name">Sam Davis</h1>
        <p class="tagline">Hi. I make apps.</p>

        <nav class="portals" aria-label="My apps">
          <a href="points/" class="portal portal--points">

            <svg class="portal__arrow" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>

            <svg class="portal__arrow" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 18 18 6M8 6h10v10"/></svg>

        </nav>

        <nav class="socials" aria-label="Contact">
